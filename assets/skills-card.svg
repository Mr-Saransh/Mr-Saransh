<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="skillCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="50%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#07070b"/>
    </linearGradient>

    <linearGradient id="skillGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="35%" stop-color="#FFDF73"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF2A1"/>
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .cat-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #FFDF73;
        letter-spacing: 1.2px;
      }
      .badge-rect {
        fill: #12121c;
        stroke: #D4AF37;
        stroke-width: 0.8;
        stroke-opacity: 0.35;
        rx: 6;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #E5E7EB;
      }
      .highlight-badge .badge-rect {
        stroke-opacity: 0.8;
        fill: #1a1608;
      }
      .highlight-badge .badge-text {
        fill: #FFDF73;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="280" rx="14" fill="url(#skillCardBg)" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Header -->
  <g transform="translate(30, 32)">
    <circle cx="10" cy="0" r="4" fill="#D4AF37"/>
    <text x="24" y="5" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="url(#skillGold)" letter-spacing="1">
      TECHNICAL CAPABILITIES &amp; ENGINEERING ARSENAL
    </text>
    <line x1="0" y1="18" x2="940" y2="18" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.2"/>
  </g>

  <!-- Column 1: Programming & Frontend -->
  <g transform="translate(30, 75)">
    <!-- Programming Languages -->
    <text x="0" y="16" class="cat-title">01 // PROGRAMMING LANGUAGES</text>
    <g transform="translate(0, 26)">
      <g class="highlight-badge">
        <rect width="52" height="26" class="badge-rect"/>
        <text x="26" y="17" text-anchor="middle" class="badge-text">C++</text>
      </g>
      <g transform="translate(60, 0)">
        <rect width="40" height="26" class="badge-rect"/>
        <text x="20" y="17" text-anchor="middle" class="badge-text">C</text>
      </g>
      <g class="highlight-badge" transform="translate(108, 0)">
        <rect width="72" height="26" class="badge-rect"/>
        <text x="36" y="17" text-anchor="middle" class="badge-text">Python</text>
      </g>
      <g class="highlight-badge" transform="translate(188, 0)">
        <rect width="94" height="26" class="badge-rect"/>
        <text x="47" y="17" text-anchor="middle" class="badge-text">JavaScript</text>
      </g>
      <g transform="translate(290, 0)">
        <rect width="56" height="26" class="badge-rect"/>
        <text x="28" y="17" text-anchor="middle" class="badge-text">SQL</text>
      </g>
    </g>

    <!-- Frontend Architecture -->
    <text x="0" y="86" class="cat-title">02 // FRONTEND ARCHITECTURE</text>
    <g transform="translate(0, 96)">
      <g class="highlight-badge">
        <rect width="76" height="26" class="badge-rect"/>
        <text x="38" y="17" text-anchor="middle" class="badge-text">Next.js</text>
      </g>
      <g class="highlight-badge" transform="translate(84, 0)">
        <rect width="68" height="26" class="badge-rect"/>
        <text x="34" y="17" text-anchor="middle" class="badge-text">React</text>
      </g>
      <g class="highlight-badge" transform="translate(160, 0)">
        <rect width="108" height="26" class="badge-rect"/>
        <text x="54" y="17" text-anchor="middle" class="badge-text">Tailwind CSS</text>
      </g>
      <g transform="translate(276, 0)">
        <rect width="68" height="26" class="badge-rect"/>
        <text x="34" y="17" text-anchor="middle" class="badge-text">HTML5</text>
      </g>
      <g transform="translate(352, 0)">
        <rect width="60" height="26" class="badge-rect"/>
        <text x="30" y="17" text-anchor="middle" class="badge-text">CSS3</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Backend, Database, Cloud & CS -->
  <g transform="translate(500, 75)">
    <!-- Backend & Database -->
    <text x="0" y="16" class="cat-title">03 // BACKEND, ORM &amp; DATABASES</text>
    <g transform="translate(0, 26)">
      <g class="highlight-badge">
        <rect width="98" height="26" class="badge-rect"/>
        <text x="49" y="17" text-anchor="middle" class="badge-text">PostgreSQL</text>
      </g>
      <g class="highlight-badge" transform="translate(106, 0)">
        <rect width="96" height="26" class="badge-rect"/>
        <text x="48" y="17" text-anchor="middle" class="badge-text">Prisma ORM</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="62" height="26" class="badge-rect"/>
        <text x="31" y="17" text-anchor="middle" class="badge-text">Flask</text>
      </g>
      <g transform="translate(280, 0)">
        <rect width="90" height="26" class="badge-rect"/>
        <text x="45" y="17" text-anchor="middle" class="badge-text">REST APIs</text>
      </g>
      <g transform="translate(378, 0)">
        <rect width="84" height="26" class="badge-rect"/>
        <text x="42" y="17" text-anchor="middle" class="badge-text">WebSocket</text>
      </g>
    </g>

    <!-- Developer Tools & Core CS -->
    <text x="0" y="86" class="cat-title">04 // TOOLS, CLOUD &amp; COMPUTER SCIENCE</text>
    <g transform="translate(0, 96)">
      <g class="highlight-badge">
        <rect width="70" height="26" class="badge-rect"/>
        <text x="35" y="17" text-anchor="middle" class="badge-text">Vercel</text>
      </g>
      <g transform="translate(78, 0)">
        <rect width="86" height="26" class="badge-rect"/>
        <text x="43" y="17" text-anchor="middle" class="badge-text">Git/GitHub</text>
      </g>
      <g transform="translate(172, 0)">
        <rect width="52" height="26" class="badge-rect"/>
        <text x="26" y="17" text-anchor="middle" class="badge-text">AWS</text>
      </g>
      <g transform="translate(232, 0)">
        <rect width="70" height="26" class="badge-rect"/>
        <text x="35" y="17" text-anchor="middle" class="badge-text">Figma</text>
      </g>
      <g transform="translate(310, 0)">
        <rect width="72" height="26" class="badge-rect"/>
        <text x="36" y="17" text-anchor="middle" class="badge-text">Docker</text>
      </g>
      <g class="highlight-badge" transform="translate(390, 0)">
        <rect width="80" height="26" class="badge-rect"/>
        <text x="40" y="17" text-anchor="middle" class="badge-text">DSA &amp; OOP</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Strip -->
  <g transform="translate(30, 246)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">
      FOCUS: HIGH PERFORMANCE • EVENT-DRIVEN COLLABORATION • SECURE RBAC &amp; PRODUCTION APIS
    </text>
  </g>
</svg>

      <text x="48" y="17" text-anchor="middle" class="pillTxt" fill="#4ADE80">PostgreSQL</text>

      <rect x="104" width="70" class="pillBox" fill="#14141e" stroke="#059669" stroke-width=".7" stroke-opacity=".4"/>
      <text x="139" y="17" text-anchor="middle" class="pillTxt" fill="#4ADE80">Prisma</text>

      <rect x="182" width="62" class="pillBox" fill="#14141e" stroke="#059669" stroke-width=".7" stroke-opacity=".4"/>
      <text x="213" y="17" text-anchor="middle" class="pillTxt" fill="#4ADE80">SQLite</text>
    </g>

    <rect x="18" y="116" width="374" height="3" rx="1.5" fill="#1a1a26"/>
    <rect x="18" y="116" height="3" rx="1.5" fill="url(#greenG)" opacity=".6">
      <animate attributeName="width" from="0" to="340" dur="2s" fill="freeze"/>
    </rect>
    <text x="18" y="132" class="catCount">PROFICIENCY: ADVANCED</text>
  </g>


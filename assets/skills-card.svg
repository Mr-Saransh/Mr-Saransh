  <g transform="translate(450,174)">
    <rect width="410" height="138" class="cardBg" fill="#0a0a14" stroke="#6D28D9" stroke-width=".8" stroke-opacity=".3"/>
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#purpleG)" opacity=".6"/>

    <circle cx="22" cy="24" r="5" fill="#A78BFA" opacity=".5" class="pulse" filter="url(#glow)"/>
    <text x="36" y="28" class="catTitle" fill="#A78BFA">DEV TOOLS &amp; CS CORE</text>
    <text x="356" y="28" class="catCount">10 SKILLS</text>

    <g transform="translate(18,42)">

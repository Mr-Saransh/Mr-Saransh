      <text x="21" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">Git</text>

      <rect x="50" width="66" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".5"/>
      <text x="83" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">GitHub</text>

      <rect x="124" width="72" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".5"/>
      <text x="160" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">VS Code</text>

      <rect x="204" width="60" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".5"/>
      <text x="234" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">Vercel</text>

      <rect x="272" width="50" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".5"/>
      <text x="297" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">AWS</text>

      <rect x="330" width="62" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".5"/>
      <text x="361" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">Render</text>
    </g>

    <g transform="translate(18,76)">
      <rect width="48" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".4"/>
      <text x="24" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">DSA</text>

      <rect x="56" width="48" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".4"/>
      <text x="80" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">OOP</text>

      <rect x="112" width="58" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".4"/>
      <text x="141" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">DBMS</text>

      <rect x="178" width="42" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".4"/>
      <text x="199" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">OS</text>

      <rect x="228" width="100" class="pillBox" fill="#14141e" stroke="#6D28D9" stroke-width=".7" stroke-opacity=".4"/>
      <text x="278" y="17" text-anchor="middle" class="pillTxt" fill="#A78BFA">Algorithms</text>
    </g>

    <rect x="18" y="116" width="374" height="3" rx="1.5" fill="#1a1a26"/>
    <rect x="18" y="116" height="3" rx="1.5" fill="url(#purpleG)" opacity=".6">

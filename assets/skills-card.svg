      <rect x="152" width="100" class="pillBox" fill="#14141e" stroke="#059669" stroke-width=".7" stroke-opacity=".5"/>
      <text x="202" y="17" text-anchor="middle" class="pillTxt" fill="#4ADE80">WebSockets</text>

      <rect x="260" width="58" class="pillBox" fill="#14141e" stroke="#059669" stroke-width=".7" stroke-opacity=".5"/>
      <text x="289" y="17" text-anchor="middle" class="pillTxt" fill="#4ADE80">RBAC</text>

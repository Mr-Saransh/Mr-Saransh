<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="50%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      .catTitle{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;font-weight:800;letter-spacing:2px}
      .catCount{font-family:'Courier New',monospace;font-size:9px;font-weight:600;fill:#6B7280}
      .pillBox{height:26;rx:6}
      .pillTxt{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.3px}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      .cardBg{rx:12}
      .footerTxt{font-family:'Courier New',monospace;font-size:9px;fill:#4B5563;font-weight:500;letter-spacing:1px}
    </style>
  </defs>

  <!-- Main Background -->
  <rect width="880" height="340" rx="14" fill="url(#bg)" stroke="#D4AF37" stroke-opacity=".2" stroke-width="1"/>

  <!-- Subtle grid -->
  <g opacity=".03">
    <line x1="0" y1="85" x2="880" y2="85" stroke="#D4AF37"/>
    <line x1="0" y1="170" x2="880" y2="170" stroke="#D4AF37"/>
    <line x1="0" y1="255" x2="880" y2="255" stroke="#D4AF37"/>
    <line x1="440" y1="0" x2="440" y2="340" stroke="#D4AF37"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity=".5">
    <path d="M 10 24 L 10 10 L 24 10"/>
    <path d="M 870 24 L 870 10 L 856 10"/>
    <path d="M 10 316 L 10 330 L 24 330"/>
    <path d="M 870 316 L 870 330 L 856 330"/>
  </g>

  <!-- ========== CARD 1: LANGUAGES (Top-Left) ========== -->
  <g transform="translate(20,18)">
    <rect width="410" height="138" class="cardBg" fill="#0a0a14" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".3"/>
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#gold)" opacity=".6"/>

    <!-- Header -->
    <circle cx="22" cy="24" r="5" fill="#D4AF37" opacity=".5" class="pulse" filter="url(#glow)"/>
    <text x="36" y="28" class="catTitle" fill="#D4AF37">LANGUAGES</text>
    <text x="370" y="28" class="catCount">6 SKILLS</text>

    <!-- Pill Row 1 -->
    <g transform="translate(18,42)">
      <rect width="52" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="26" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">C++</text>

      <rect x="60" width="36" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="78" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">C</text>

      <rect x="104" width="64" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="136" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">Python</text>

      <rect x="176" width="86" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="219" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">JavaScript</text>

      <rect x="270" width="48" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="294" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">SQL</text>

      <rect x="326" width="56" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="354" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">ES6+</text>
    </g>

    <!-- Pill Row 2 -->
    <g transform="translate(18,76)">
      <rect width="90" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".5"/>
      <text x="45" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">TypeScript</text>

      <rect x="98" width="60" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".4"/>
      <text x="128" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">HTML5</text>

      <rect x="166" width="56" class="pillBox" fill="#14141e" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".4"/>
      <text x="194" y="17" text-anchor="middle" class="pillTxt" fill="#FFDF73">CSS3</text>
    </g>

    <!-- Progress bar -->
    <rect x="18" y="116" width="374" height="3" rx="1.5" fill="#1a1a26"/>
    <rect x="18" y="116" height="3" rx="1.5" fill="url(#gold)" opacity=".6">
      <animate attributeName="width" from="0" to="374" dur="2s" fill="freeze"/>
    </rect>
    <text x="18" y="132" class="catCount">PROFICIENCY: ADVANCED</text>
  </g>

  <!-- ========== CARD 2: FRONTEND (Top-Right) ========== -->
  <g transform="translate(450,18)">
    <rect width="410" height="138" class="cardBg" fill="#0a0a14" stroke="#0891B2" stroke-width=".8" stroke-opacity=".3"/>
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#cyanG)" opacity=".6"/>

    <circle cx="22" cy="24" r="5" fill="#22D3EE" opacity=".5" class="pulse" filter="url(#glow)"/>
    <text x="36" y="28" class="catTitle" fill="#22D3EE">FRONTEND ARCHITECTURE</text>
    <text x="370" y="28" class="catCount">5 SKILLS</text>

    <g transform="translate(18,42)">
      <rect width="70" class="pillBox" fill="#14141e" stroke="#0891B2" stroke-width=".7" stroke-opacity=".5"/>
      <text x="35" y="17" text-anchor="middle" class="pillTxt" fill="#22D3EE">React.js</text>

      <rect x="78" width="66" class="pillBox" fill="#14141e" stroke="#0891B2" stroke-width=".7" stroke-opacity=".5"/>
      <text x="111" y="17" text-anchor="middle" class="pillTxt" fill="#22D3EE">Next.js</text>

      <rect x="152" width="100" class="pillBox" fill="#14141e" stroke="#0891B2" stroke-width=".7" stroke-opacity=".5"/>
      <text x="202" y="17" text-anchor="middle" class="pillTxt" fill="#22D3EE">Tailwind CSS</text>

      <rect x="260" width="124" class="pillBox" fill="#14141e" stroke="#0891B2" stroke-width=".7" stroke-opacity=".5"/>
      <text x="322" y="17" text-anchor="middle" class="pillTxt" fill="#22D3EE">Responsive Design</text>

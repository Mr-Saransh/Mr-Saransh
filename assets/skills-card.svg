      <rect x="118" width="110" class="pillBox" fill="#14141e" stroke="#0891B2" stroke-width=".7" stroke-opacity=".4"/>
      <text x="173" y="17" text-anchor="middle" class="pillTxt" fill="#22D3EE">Component UI</text>


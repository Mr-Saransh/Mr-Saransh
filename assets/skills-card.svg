    </rect>
    <text x="18" y="132" class="catCount">PROFICIENCY: ADVANCED</text>
  </g>

  <!-- Bottom footer -->
  <line x1="30" y1="325" x2="850" y2="325" stroke="url(#gold)" stroke-width=".4" stroke-opacity=".25"/>
  <text x="440" y="336" text-anchor="middle" class="footerTxt">COMPILED FROM VERIFIED PROJECT ARCHITECTURES • SARANSH GUPTA • UPDATED SEPT 2026</text>
</svg>

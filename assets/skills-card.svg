<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="50%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fadeIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      .catLabel{font-family:'Courier New',monospace;font-size:10px;font-weight:700;fill:#D4AF37;letter-spacing:1.5px}
      .pillBox{fill:#0e0e18;stroke-width:.7;rx:5;height:22}
      .pillTxt{font-family:'Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:.5px}
      .goldPill{stroke:#D4AF37;stroke-opacity:.45}
      .goldTxt{fill:#FFDF73}
      .cyanPill{stroke:#06B6D4;stroke-opacity:.45}
      .cyanTxt{fill:#22D3EE}
      .greenPill{stroke:#059669;stroke-opacity:.45}
      .greenTxt{fill:#4ADE80}
      .purplePill{stroke:#7C3AED;stroke-opacity:.45}
      .purpleTxt{fill:#A78BFA}
    </style>
  </defs>

  <!-- BG -->
  <rect width="880" height="200" rx="14" fill="url(#bg)" stroke="#D4AF37" stroke-opacity=".2" stroke-width="1"/>

  <!-- Grid -->
  <g opacity=".04">
    <line x1="0" y1="50" x2="880" y2="50" stroke="#D4AF37"/>
    <line x1="0" y1="100" x2="880" y2="100" stroke="#D4AF37"/>
    <line x1="0" y1="150" x2="880" y2="150" stroke="#D4AF37"/>
    <line x1="440" y1="0" x2="440" y2="200" stroke="#D4AF37"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity=".5">
    <path d="M 10 24 L 10 10 L 24 10"/>
    <path d="M 870 24 L 870 10 L 856 10"/>
    <path d="M 10 176 L 10 190 L 24 190"/>
    <path d="M 870 176 L 870 190 L 856 190"/>
  </g>

  <!-- Section: Languages -->
  <g transform="translate(24,20)">
    <circle cx="6" cy="6" r="3" fill="#FFDF73" filter="url(#glow)">
      <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="10" class="catLabel">LANGUAGES</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="42" class="pillBox goldPill"/><text x="21" y="15" text-anchor="middle" class="pillTxt goldTxt">C++</text>
      <rect x="50" y="0" width="26" class="pillBox goldPill"/><text x="63" y="15" text-anchor="middle" class="pillTxt goldTxt">C</text>
      <rect x="84" y="0" width="54" class="pillBox goldPill"/><text x="111" y="15" text-anchor="middle" class="pillTxt goldTxt">Python</text>
      <rect x="146" y="0" width="76" class="pillBox goldPill"/><text x="184" y="15" text-anchor="middle" class="pillTxt goldTxt">JavaScript</text>
      <rect x="230" y="0" width="36" class="pillBox goldPill"/><text x="248" y="15" text-anchor="middle" class="pillTxt goldTxt">SQL</text>
      <rect x="274" y="0" width="80" class="pillBox goldPill"/><text x="314" y="15" text-anchor="middle" class="pillTxt goldTxt">TypeScript</text>
    </g>
  </g>

  <!-- Section: Frontend Architecture -->
  <g transform="translate(460,20)">
    <circle cx="6" cy="6" r="3" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="10" class="catLabel" style="fill:#22D3EE">FRONTEND ARCHITECTURE</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="64" class="pillBox cyanPill"/><text x="32" y="15" text-anchor="middle" class="pillTxt cyanTxt">React.js</text>
      <rect x="72" y="0" width="58" class="pillBox cyanPill"/><text x="101" y="15" text-anchor="middle" class="pillTxt cyanTxt">Next.js</text>
      <rect x="138" y="0" width="48" class="pillBox cyanPill"/><text x="162" y="15" text-anchor="middle" class="pillTxt cyanTxt">HTML5</text>
      <rect x="194" y="0" width="44" class="pillBox cyanPill"/><text x="216" y="15" text-anchor="middle" class="pillTxt cyanTxt">CSS3</text>
      <rect x="246" y="0" width="80" class="pillBox cyanPill"/><text x="286" y="15" text-anchor="middle" class="pillTxt cyanTxt">Tailwind CSS</text>
    </g>
  </g>

  <!-- Section: Backend & Database -->
  <g transform="translate(24,100)">
    <circle cx="6" cy="6" r="3" fill="#4ADE80" filter="url(#glow)">
      <animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="10" class="catLabel" style="fill:#4ADE80">BACKEND &amp; DATABASE</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="44" class="pillBox greenPill"/><text x="22" y="15" text-anchor="middle" class="pillTxt greenTxt">Flask</text>
      <rect x="52" y="0" width="72" class="pillBox greenPill"/><text x="88" y="15" text-anchor="middle" class="pillTxt greenTxt">REST APIs</text>
      <rect x="132" y="0" width="86" class="pillBox greenPill"/><text x="175" y="15" text-anchor="middle" class="pillTxt greenTxt">WebSockets</text>
      <rect x="226" y="0" width="82" class="pillBox greenPill"/><text x="267" y="15" text-anchor="middle" class="pillTxt greenTxt">PostgreSQL</text>
      <rect x="316" y="0" width="58" class="pillBox greenPill"/><text x="345" y="15" text-anchor="middle" class="pillTxt greenTxt">Prisma</text>
      <rect x="382" y="0" width="52" class="pillBox greenPill"/><text x="408" y="15" text-anchor="middle" class="pillTxt greenTxt">SQLite</text>
    </g>
  </g>

  <!-- Section: DevTools & CS Fundamentals -->
  <g transform="translate(460,100)">
    <circle cx="6" cy="6" r="3" fill="#A78BFA" filter="url(#glow)">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="10" class="catLabel" style="fill:#A78BFA">DEV TOOLS &amp; CS CORE</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="32" class="pillBox purplePill"/><text x="16" y="15" text-anchor="middle" class="pillTxt purpleTxt">Git</text>
      <rect x="40" y="0" width="56" class="pillBox purplePill"/><text x="68" y="15" text-anchor="middle" class="pillTxt purpleTxt">GitHub</text>
      <rect x="104" y="0" width="60" class="pillBox purplePill"/><text x="134" y="15" text-anchor="middle" class="pillTxt purpleTxt">VS Code</text>
      <rect x="172" y="0" width="50" class="pillBox purplePill"/><text x="197" y="15" text-anchor="middle" class="pillTxt purpleTxt">Figma</text>
      <rect x="230" y="0" width="50" class="pillBox purplePill"/><text x="255" y="15" text-anchor="middle" class="pillTxt purpleTxt">Vercel</text>
      <rect x="288" y="0" width="40" class="pillBox purplePill"/><text x="308" y="15" text-anchor="middle" class="pillTxt purpleTxt">AWS</text>
    </g>
    <g transform="translate(0,50)">
      <rect x="0" y="0" width="46" class="pillBox purplePill"/><text x="23" y="15" text-anchor="middle" class="pillTxt purpleTxt">DSA</text>
      <rect x="54" y="0" width="40" class="pillBox purplePill"/><text x="74" y="15" text-anchor="middle" class="pillTxt purpleTxt">OOP</text>
      <rect x="102" y="0" width="52" class="pillBox purplePill"/><text x="128" y="15" text-anchor="middle" class="pillTxt purpleTxt">DBMS</text>
      <rect x="162" y="0" width="36" class="pillBox purplePill"/><text x="180" y="15" text-anchor="middle" class="pillTxt purpleTxt">OS</text>
      <rect x="206" y="0" width="48" class="pillBox purplePill"/><text x="230" y="15" text-anchor="middle" class="pillTxt purpleTxt">RBAC</text>
    </g>
  </g>

  <!-- Bottom divider line -->
  <line x1="30" y1="185" x2="850" y2="185" stroke="url(#gold)" stroke-width=".5" stroke-opacity=".3"/>
  <text x="440" y="197" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#6B7280" font-weight="500" letter-spacing="1">COMPILED FROM VERIFIED PROJECT ARCHITECTURES • UPDATED SEPT 2026</text>
</svg>

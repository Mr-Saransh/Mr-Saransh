<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040405"/>
      <stop offset="50%" stop-color="#09090d"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="25%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#FFF2A1"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="30%" stop-color="#FFDF73"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF8D6"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFDF73" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 10px rgba(212,175,55,0.3)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 25px rgba(255,223,115,0.7)); }
      }
      @keyframes beamSlide {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      .circuit-line {
        stroke: #D4AF37;
        stroke-opacity: 0.2;
        stroke-dasharray: 6 4;
        fill: none;
      }
      .beam {
        stroke: url(#glowLine);
        stroke-width: 2;
        stroke-dasharray: 300 900;
        animation: beamSlide 6s linear infinite;
        fill: none;
      }
      .title-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 6px;
        fill: url(#goldMetallic);
        filter: url(#softGlow);
      }
      .sub-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #FFDF73;
        font-size: 13px;
      }
      .pill-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #FFDF73;
      }
      .pulse-item {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .floating-ring {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#D4AF37" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Radial Golden Aura in Center -->
  <circle cx="500" cy="160" r="320" fill="url(#centerOrb)"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="0" y1="80" x2="1000" y2="80" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="0" y1="120" x2="1000" y2="120" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="0" y1="200" x2="1000" y2="200" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="0" y1="240" x2="1000" y2="240" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="0" y1="280" x2="1000" y2="280" stroke="#D4AF37" stroke-width="0.75"/>

    <line x1="100" y1="0" x2="100" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="500" y1="0" x2="500" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="700" y1="0" x2="700" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="800" y1="0" x2="800" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
    <line x1="900" y1="0" x2="900" y2="320" stroke="#D4AF37" stroke-width="0.75"/>
  </g>

  <!-- Circuit Laser Beams -->
  <path d="M 40 40 L 260 40 L 300 80 L 700 80 L 740 40 L 960 40" class="circuit-line"/>
  <path d="M 40 40 L 260 40 L 300 80 L 700 80 L 740 40 L 960 40" class="beam"/>

  <path d="M 60 280 L 220 280 L 260 250 L 740 250 L 780 280 L 940 280" class="circuit-line"/>
  <path d="M 60 280 L 220 280 L 260 250 L 740 250 L 780 280 L 940 280" class="beam" style="animation-delay: -3s;"/>

  <!-- Futuristic Corner Brackets -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <path d="M 16 36 L 16 16 L 36 16"/>
    <path d="M 984 36 L 984 16 L 964 16"/>
    <path d="M 16 284 L 16 304 L 36 304"/>
    <path d="M 984 284 L 984 304 L 964 304"/>
  </g>

  <!-- Animated Decorative Geometric Rings (Left & Right) -->
  <g class="floating-ring" transform="translate(100, 160)">
    <circle cx="0" cy="0" r="48" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    <circle cx="0" cy="0" r="36" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="#FFDF73" opacity="0.8" filter="url(#softGlow)"/>
    <polygon points="0,-24 20,12 -20,12" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <g class="floating-ring" transform="translate(900, 160)" style="animation-delay:-3.5s;">
    <circle cx="0" cy="0" r="48" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    <circle cx="0" cy="0" r="36" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="10 8" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="#FFDF73" opacity="0.8" filter="url(#softGlow)"/>
    <polygon points="0,24 20,-12 -20,-12" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(500, 52)">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0C0C12" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="-188" cy="0" r="4.5" fill="#4ADE80" filter="url(#softGlow)"/>
    <text x="-172" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFDF73" letter-spacing="1">FULL STACK ARCHITECT • OPEN FOR HIGH-IMPACT ROLES</text>
  </g>

  <!-- Main Hero Name -->
  <text x="500" y="132" text-anchor="middle" class="title-text" font-size="44">SARANSH GUPTA</text>

  <!-- Subtitle / Engineering Role -->
  <text x="500" y="170" text-anchor="middle" class="sub-text">FULL STACK DEVELOPER • SCALABLE SYSTEMS &amp; REAL-TIME PLATFORMS</text>

  <!-- Core Tech Badges Stack -->
  <g transform="translate(500, 215)">
    <!-- Next.js -->
    <g transform="translate(-250, 0)">
      <rect x="-42" y="-12" width="84" height="24" rx="6" fill="#121218" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" class="pill-text">Next.js</text>
    </g>
    <!-- React -->
    <g transform="translate(-150, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="6" fill="#121218" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" class="pill-text">React</text>
    </g>
    <!-- Tailwind CSS -->
    <g transform="translate(-50, 0)">
      <rect x="-48" y="-12" width="96" height="24" rx="6" fill="#121218" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" class="pill-text">TailwindCSS</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(55, 0)">
      <rect x="-46" y="-12" width="92" height="24" rx="6" fill="#121218" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" class="pill-text">PostgreSQL</text>
    </g>
    <!-- Prisma ORM -->
    <g transform="translate(155, 0)">
      <rect x="-42" y="-12" width="84" height="24" rx="6" fill="#121218" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" class="pill-text">Prisma</text>
    </g>
    <!-- Python & C++ -->
    <g transform="translate(252, 0)">
      <rect x="-44" y="-12" width="88" height="24" rx="6" fill="#121218" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" class="pill-text">Python / C++</text>
    </g>
  </g>

  <!-- Bottom Interactive Callout -->
  <g transform="translate(500, 275)" class="pulse-item">
    <rect x="-265" y="-15" width="530" height="30" rx="15" fill="#101016" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#FFDF73" letter-spacing="1.2">
      🏆 1ST PRIZE MERI-CET • BEST STUDENT INNOVATOR 2026 • RANK 1ST (SEM II &amp; IV)
    </text>
  </g>
</svg>

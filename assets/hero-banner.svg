<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="50%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="25%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#FFF2A1"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#66430B"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#FFF8D6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFDF73" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity=".18"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D6" stop-opacity=".9"/>
      <stop offset="40%" stop-color="#FFDF73" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.85} }
      @keyframes pulse2 { 0%,100%{opacity:.15} 50%{opacity:.5} }
      @keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }
      @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes spinR { 0%{transform:rotate(0deg)} 100%{transform:rotate(-360deg)} }
      @keyframes dash { 0%{stroke-dashoffset:1200} 100%{stroke-dashoffset:0} }
      @keyframes scan { 0%{transform:translateY(-150px);opacity:0} 10%{opacity:.4} 90%{opacity:.4} 100%{transform:translateY(150px);opacity:0} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.3} }
      @keyframes slideIn { 0%{transform:translateX(-30px);opacity:0} 100%{transform:translateX(0);opacity:1} }
      @keyframes gPulse { 0%,100%{r:10;opacity:.6} 50%{r:14;opacity:1} }
      @keyframes particle1 { 0%{transform:translate(0,0);opacity:.7} 50%{transform:translate(12px,-8px);opacity:.3} 100%{transform:translate(0,0);opacity:.7} }
      @keyframes particle2 { 0%{transform:translate(0,0);opacity:.5} 50%{transform:translate(-10px,6px);opacity:.8} 100%{transform:translate(0,0);opacity:.5} }
      @keyframes particle3 { 0%{transform:translate(0,0);opacity:.6} 50%{transform:translate(8px,10px);opacity:.2} 100%{transform:translate(0,0);opacity:.6} }
      .beam-anim{stroke:url(#beam);stroke-width:2;stroke-dasharray:200 700;animation:dash 5s linear infinite;fill:none}
      .circuit{stroke:#D4AF37;stroke-opacity:.15;stroke-dasharray:5 4;fill:none;stroke-width:.8}
      .orb-spin{animation:spin 20s linear infinite;transform-origin:440px 150px}
      .orb-spinR{animation:spinR 15s linear infinite;transform-origin:440px 150px}
      .pulseDot{animation:pulse 3s ease-in-out infinite}
      .pulseDot2{animation:pulse2 4s ease-in-out infinite}
      .fl1{animation:float1 6s ease-in-out infinite}
      .fl2{animation:float2 5s ease-in-out infinite}
      .scanner{animation:scan 4s ease-in-out infinite}
      .blinker{animation:blink 1.5s step-end infinite}
      .p1{animation:particle1 7s ease-in-out infinite}
      .p2{animation:particle2 5s ease-in-out infinite}
      .p3{animation:particle3 9s ease-in-out infinite}
      .titleFont{font-family:'Segoe UI',system-ui,sans-serif;font-weight:900;letter-spacing:5px;fill:url(#goldV);filter:url(#glow)}
      .subFont{font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;letter-spacing:2.5px;fill:#FFDF73;font-size:12px}
      .monoFont{font-family:'Courier New',monospace;font-weight:700;fill:#FFDF73;font-size:10.5px;letter-spacing:.8px}
      .pillBg{fill:#0c0c14;stroke:#D4AF37;stroke-width:.8;stroke-opacity:.5}
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="300" rx="14" fill="url(#bg)" stroke="#D4AF37" stroke-opacity=".2" stroke-width="1.2"/>

  <!-- Radial Aura -->
  <circle cx="440" cy="150" r="280" fill="url(#aura)"/>

  <!-- Fine Grid -->
  <g opacity=".06">
    <line x1="0" y1="60" x2="880" y2="60" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="0" y1="100" x2="880" y2="100" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="0" y1="140" x2="880" y2="140" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="0" y1="180" x2="880" y2="180" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="0" y1="220" x2="880" y2="220" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="0" y1="260" x2="880" y2="260" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="88" y1="0" x2="88" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="176" y1="0" x2="176" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="264" y1="0" x2="264" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="352" y1="0" x2="352" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="440" y1="0" x2="440" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="528" y1="0" x2="528" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="616" y1="0" x2="616" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="704" y1="0" x2="704" y2="300" stroke="#D4AF37" stroke-width=".5"/>
    <line x1="792" y1="0" x2="792" y2="300" stroke="#D4AF37" stroke-width=".5"/>
  </g>

  <!-- Circuit Beams -->
  <path d="M 30 35 L 220 35 L 250 60 L 630 60 L 660 35 L 850 35" class="circuit"/>
  <path d="M 30 35 L 220 35 L 250 60 L 630 60 L 660 35 L 850 35" class="beam-anim"/>
  <path d="M 50 265 L 180 265 L 210 240 L 670 240 L 700 265 L 830 265" class="circuit"/>
  <path d="M 50 265 L 180 265 L 210 240 L 670 240 L 700 265 L 830 265" class="beam-anim" style="animation-delay:-2.5s"/>

  <!-- Diagonal accent beams -->
  <path d="M 20 140 L 60 90 L 120 90" class="circuit"/>
  <path d="M 20 140 L 60 90 L 120 90" class="beam-anim" style="animation-delay:-1s"/>
  <path d="M 860 160 L 820 210 L 760 210" class="circuit"/>
  <path d="M 860 160 L 820 210 L 760 210" class="beam-anim" style="animation-delay:-3.5s"/>

  <!-- Corner brackets -->
  <g stroke="url(#gold)" stroke-width="2" fill="none">
    <path d="M 14 32 L 14 14 L 32 14"/>
    <path d="M 866 32 L 866 14 L 848 14"/>
    <path d="M 14 268 L 14 286 L 32 286"/>
    <path d="M 866 268 L 866 286 L 848 286"/>
  </g>

  <!-- Scanning beam effect -->
  <g class="scanner" opacity=".3">
    <rect x="100" y="148" width="680" height="2" rx="1" fill="url(#beam)"/>
  </g>

  <!-- Orbital rings around center -->
  <g class="orb-spin">
    <ellipse cx="440" cy="150" rx="120" ry="42" stroke="#D4AF37" stroke-width=".7" stroke-opacity=".2" fill="none" stroke-dasharray="4 6"/>
  </g>
  <g class="orb-spinR">
    <ellipse cx="440" cy="150" rx="90" ry="55" stroke="#FFDF73" stroke-width=".5" stroke-opacity=".15" fill="none" stroke-dasharray="6 4"/>
  </g>
  <g class="orb-spin" style="animation-duration:30s">
    <ellipse cx="440" cy="150" rx="150" ry="30" stroke="#D4AF37" stroke-width=".5" stroke-opacity=".1" fill="none" stroke-dasharray="3 8"/>
  </g>

  <!-- Floating particles -->
  <circle cx="180" cy="80" r="2" fill="#FFDF73" opacity=".5" class="p1"/>
  <circle cx="700" cy="100" r="1.5" fill="#D4AF37" opacity=".4" class="p2"/>
  <circle cx="300" cy="220" r="2.5" fill="#FFDF73" opacity=".3" class="p3"/>
  <circle cx="600" cy="230" r="1.8" fill="#D4AF37" opacity=".5" class="p1" style="animation-delay:-3s"/>
  <circle cx="150" cy="200" r="1.2" fill="#FFF2A1" opacity=".4" class="p2" style="animation-delay:-1s"/>
  <circle cx="750" cy="70" r="2" fill="#D4AF37" opacity=".3" class="p3" style="animation-delay:-5s"/>
  <circle cx="350" cy="60" r="1" fill="#FFDF73" opacity=".6" class="p1" style="animation-delay:-4s"/>
  <circle cx="550" cy="250" r="1.5" fill="#FFF2A1" opacity=".3" class="p2" style="animation-delay:-2s"/>

  <!-- Left decorative element - hexagonal tech node -->
  <g transform="translate(85,150)" class="fl1">
    <circle r="40" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".2" fill="none"/>
    <circle r="28" stroke="url(#gold)" stroke-width="1" stroke-dasharray="6 5" fill="none" opacity=".4"/>
    <polygon points="0,-18 15.6,9 -15.6,9" stroke="#D4AF37" stroke-width=".8" fill="none" opacity=".3"/>
    <polygon points="0,18 15.6,-9 -15.6,-9" stroke="#D4AF37" stroke-width=".8" fill="none" opacity=".3"/>
    <circle r="6" fill="#FFDF73" opacity=".7" filter="url(#glow3)">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;.9;.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right decorative element -->
  <g transform="translate(795,150)" class="fl2">
    <circle r="40" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".2" fill="none"/>
    <circle r="28" stroke="url(#gold)" stroke-width="1" stroke-dasharray="8 4" fill="none" opacity=".4"/>
    <rect x="-14" y="-14" width="28" height="28" rx="4" stroke="#D4AF37" stroke-width=".8" fill="none" opacity=".3" transform="rotate(45)"/>
    <circle r="6" fill="#FFDF73" opacity=".7" filter="url(#glow3)">
      <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;.9;.5" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Core center glow -->
  <circle cx="440" cy="150" r="12" fill="url(#core)" filter="url(#glow2)">
    <animate attributeName="r" values="10;16;10" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;.9;.5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Status pill top -->
  <g transform="translate(440,44)">
    <rect x="-195" y="-13" width="390" height="26" rx="13" fill="#0a0a14" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".4"/>
    <circle cx="-176" cy="0" r="3.5" fill="#4ADE80" filter="url(#glow3)">
      <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-162" y="4" class="monoFont">FULL STACK ARCHITECT • OPEN FOR HIGH-IMPACT ROLES</text>
  </g>

  <!-- Main Title -->
  <text x="440" y="120" text-anchor="middle" class="titleFont" font-size="40">SARANSH GUPTA</text>

  <!-- Subtitle -->
  <text x="440" y="152" text-anchor="middle" class="subFont">FULL STACK DEVELOPER • SCALABLE SYSTEMS &amp; REAL-TIME PLATFORMS</text>

  <!-- Tech badges row -->
  <g transform="translate(440,190)">
    <g transform="translate(-230,0)"><rect x="-38" y="-11" width="76" height="22" rx="5" class="pillBg"/><text x="0" y="4" text-anchor="middle" class="monoFont">Next.js</text></g>
    <g transform="translate(-140,0)"><rect x="-32" y="-11" width="64" height="22" rx="5" class="pillBg"/><text x="0" y="4" text-anchor="middle" class="monoFont">React</text></g>
    <g transform="translate(-55,0)"><rect x="-42" y="-11" width="84" height="22" rx="5" class="pillBg"/><text x="0" y="4" text-anchor="middle" class="monoFont">TypeScript</text></g>
    <g transform="translate(40,0)"><rect x="-42" y="-11" width="84" height="22" rx="5" class="pillBg"/><text x="0" y="4" text-anchor="middle" class="monoFont">PostgreSQL</text></g>
    <g transform="translate(130,0)"><rect x="-34" y="-11" width="68" height="22" rx="5" class="pillBg"/><text x="0" y="4" text-anchor="middle" class="monoFont">Prisma</text></g>
    <g transform="translate(210,0)"><rect x="-34" y="-11" width="68" height="22" rx="5" class="pillBg"/><text x="0" y="4" text-anchor="middle" class="monoFont">Python</text></g>
  </g>

  <!-- DNA helix decoration left -->
  <g opacity=".15" transform="translate(160,80)">
    <path d="M0,0 Q10,-10 20,0 Q30,10 40,0 Q50,-10 60,0 Q70,10 80,0 Q90,-10 100,0" stroke="#D4AF37" stroke-width="1" fill="none"/>
    <path d="M0,0 Q10,10 20,0 Q30,-10 40,0 Q50,10 60,0 Q70,-10 80,0 Q90,10 100,0" stroke="#FFDF73" stroke-width="1" fill="none"/>
  </g>
  <g opacity=".15" transform="translate(620,220)">
    <path d="M0,0 Q10,-10 20,0 Q30,10 40,0 Q50,-10 60,0 Q70,10 80,0 Q90,-10 100,0" stroke="#D4AF37" stroke-width="1" fill="none"/>
    <path d="M0,0 Q10,10 20,0 Q30,-10 40,0 Q50,10 60,0 Q70,-10 80,0 Q90,10 100,0" stroke="#FFDF73" stroke-width="1" fill="none"/>
  </g>

  <!-- Bottom Achievement bar -->
  <g transform="translate(440,260)">
    <rect x="-260" y="-14" width="520" height="28" rx="14" fill="#08080f" stroke="url(#gold)" stroke-width="1">
      <animate attributeName="stroke-opacity" values=".4;.8;.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#FFDF73" letter-spacing="1">
      🏆 1ST PRIZE MERI-CET • BEST INNOVATOR 2026 • RANK 1ST SEM II &amp; IV
    </text>
  </g>

  <!-- Blinking cursor effect at bottom right -->
  <rect x="820" y="275" width="8" height="14" rx="1" fill="#FFDF73" opacity=".7" class="blinker"/>
</svg>

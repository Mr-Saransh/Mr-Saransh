<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="50%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#66430B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF8D6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFDF73" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
      @keyframes dash{0%{stroke-dashoffset:800}100%{stroke-dashoffset:0}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.2}}
      .titleFont{font-family:'Segoe UI',system-ui,sans-serif;font-weight:900;fill:url(#goldV);filter:url(#glow)}
      .monoFont{font-family:'Courier New',monospace;font-weight:700;fill:#FFDF73;font-size:10px;letter-spacing:.8px}
      .subMono{font-family:'Courier New',monospace;font-size:9.5px;font-weight:600;fill:#9CA3AF;letter-spacing:.5px}
      .beam-anim{stroke:url(#beam);stroke-width:1.5;stroke-dasharray:150 650;animation:dash 5s linear infinite;fill:none}
      .circuit{stroke:#D4AF37;stroke-opacity:.12;stroke-dasharray:4 3;fill:none;stroke-width:.6}
      .fl1{animation:float1 5s ease-in-out infinite}
      .fl2{animation:float2 4s ease-in-out infinite}
      .blinker{animation:blink 1.2s step-end infinite}
    </style>
  </defs>

  <!-- BG -->
  <rect width="880" height="200" rx="14" fill="url(#bg)" stroke="#D4AF37" stroke-opacity=".2" stroke-width="1"/>

  <!-- Grid -->
  <g opacity=".04">
    <line x1="0" y1="50" x2="880" y2="50" stroke="#D4AF37"/>
    <line x1="0" y1="100" x2="880" y2="100" stroke="#D4AF37"/>
    <line x1="0" y1="150" x2="880" y2="150" stroke="#D4AF37"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity=".5">
    <path d="M 10 24 L 10 10 L 24 10"/>
    <path d="M 870 24 L 870 10 L 856 10"/>
    <path d="M 10 176 L 10 190 L 24 190"/>
    <path d="M 870 176 L 870 190 L 856 190"/>
  </g>

  <!-- Circuit beams -->
  <path d="M 30 30 L 150 30 L 170 50 L 710 50 L 730 30 L 850 30" class="circuit"/>
  <path d="M 30 30 L 150 30 L 170 50 L 710 50 L 730 30 L 850 30" class="beam-anim"/>
  <path d="M 30 170 L 150 170 L 170 150 L 710 150 L 730 170 L 850 170" class="circuit"/>
  <path d="M 30 170 L 150 170 L 170 150 L 710 150 L 730 170 L 850 170" class="beam-anim" style="animation-delay:-2.5s"/>

  <!-- Game preview area -->
  <g transform="translate(440,100)">
    <!-- Starfighter ship (golden) -->
    <g transform="translate(-120, 0)" class="fl1">
      <polygon points="22,0 -12,-14 -6,-4 -14,0 -6,4 -12,14" fill="url(#goldV)" filter="url(#glow)"/>
      <!-- Thruster -->
      <polygon points="-14,-4 -22,0 -14,4" fill="#60A5FA" opacity=".7"/>
    </g>

    <!-- Laser beams shooting from ship -->
    <line x1="-96" y1="0" x2="20" y2="0" stroke="#FFDF73" stroke-width="2" opacity=".6" filter="url(#glow)">
      <animate attributeName="opacity" values="0;.8;0" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="-96" y1="-6" x2="40" y2="-14" stroke="#FFDF73" stroke-width="1.5" opacity=".4" filter="url(#glow)">
      <animate attributeName="opacity" values="0;.5;0" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="-96" y1="6" x2="40" y2="14" stroke="#FFDF73" stroke-width="1.5" opacity=".4" filter="url(#glow)">
      <animate attributeName="opacity" values="0;.5;0" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- Enemy bugs -->
    <g transform="translate(80, -20)" class="fl2">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#EF4444" opacity=".7" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#fff" font-weight="700">404</text>
    </g>
    <g transform="translate(130, 15)" class="fl1" style="animation-delay:-1s">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#F59E0B" opacity=".7" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#fff" font-weight="700">LAG</text>
    </g>
    <g transform="translate(170, -30)" class="fl2" style="animation-delay:-2s">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#8B5CF6" opacity=".7" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#fff" font-weight="700">LEAK</text>
    </g>

    <!-- Golden crystal -->
    <g transform="translate(50, 30)">
      <polygon points="0,-8 7,0 0,8 -7,0" fill="#FFDF73" opacity=".8" filter="url(#glow)">
        <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Explosion particles -->
    <circle cx="110" cy="-5" r="2" fill="#EF4444" opacity=".5">
      <animate attributeName="r" values="1;4;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="5" r="1.5" fill="#FFDF73" opacity=".4">
      <animate attributeName="r" values="1;3;0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left side title -->
  <text x="26" y="55" class="titleFont" font-size="20">CYBER GOLD</text>
  <text x="26" y="78" class="titleFont" font-size="16">DEFENDER ARCADE</text>

  <!-- Game info left -->
  <text x="26" y="110" class="subMono">ENGINE: CANVAS 2D • 60 FPS</text>
  <text x="26" y="126" class="subMono">AUDIO: WEB AUDIO SYNTH</text>
  <text x="26" y="142" class="subMono">CONTROLS: MOUSE / TOUCH / WASD</text>

  <!-- Right side info -->
  <text x="854" y="55" text-anchor="end" class="monoFont">🕹️ PLAYABLE MINI-GAME</text>
  <text x="854" y="73" text-anchor="end" class="subMono">Zero External Libraries</text>

  <!-- Bottom call to action -->
  <g transform="translate(440,182)">
    <rect x="-160" y="-13" width="320" height="26" rx="13" fill="#0a0a14" stroke="url(#gold)" stroke-width=".8">
      <animate attributeName="stroke-opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="4" text-anchor="middle" class="monoFont" font-size="11">🚀 CLICK TO LAUNCH STARFIGHTER</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="840" y="175" width="6" height="12" rx="1" fill="#FFDF73" opacity=".6" class="blinker"/>
</svg>

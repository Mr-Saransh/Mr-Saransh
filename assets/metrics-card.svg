<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="50%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes barSlide{0%{width:0}100%{width:100%}}
      .label{font-family:'Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;fill:#6B7280}
      .bigVal{font-family:'Segoe UI',system-ui,sans-serif;font-weight:900;fill:#FFDF73;filter:url(#glow)}
      .desc{font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;fill:#D4D4D4;font-weight:500}
      .subDesc{font-family:'Courier New',monospace;font-size:9.5px;fill:#6B7280;font-weight:500}
      .statusTxt{font-family:'Courier New',monospace;font-size:9px;font-weight:700}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      .cardBg{rx:12}
    </style>
  </defs>

  <!-- Main Background -->
  <rect width="880" height="340" rx="14" fill="url(#bg)" stroke="#D4AF37" stroke-opacity=".2" stroke-width="1"/>

  <!-- Subtle grid -->
  <g opacity=".03">
    <line x1="0" y1="85" x2="880" y2="85" stroke="#D4AF37"/>
    <line x1="0" y1="170" x2="880" y2="170" stroke="#D4AF37"/>
    <line x1="0" y1="255" x2="880" y2="255" stroke="#D4AF37"/>
    <line x1="440" y1="0" x2="440" y2="340" stroke="#D4AF37"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity=".5">
    <path d="M 10 24 L 10 10 L 24 10"/>
    <path d="M 870 24 L 870 10 L 856 10"/>
    <path d="M 10 316 L 10 330 L 24 330"/>
    <path d="M 870 316 L 870 330 L 856 330"/>
  </g>

  <!-- ========== CARD 1: Academic Rank (Top-Left) ========== -->
  <g transform="translate(20,18)">
    <rect width="410" height="140" class="cardBg" fill="#0a0a14" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".3"/>
    <!-- Gold accent bar -->
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#gold)" opacity=".6"/>
    <!-- Decorative corner dots -->
    <circle cx="16" cy="16" r="3" fill="#D4AF37" opacity=".3"/>
    <circle cx="394" cy="16" r="3" fill="#D4AF37" opacity=".3"/>

    <text x="24" y="34" class="label">ACADEMIC STANDING</text>

    <!-- Big Value -->
    <text x="24" y="80" class="bigVal" font-size="38">RANK 1ST</text>
    <text x="230" y="80" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" fill="#9CA3AF">in Semester</text>
    <text x="314" y="80" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFDF73">II &amp; IV</text>

    <!-- Description -->
    <text x="24" y="100" class="desc">CSE Department Topper — MERI College of Eng. &amp; Tech. (MDU)</text>
    <text x="24" y="116" class="subDesc">B.Tech Computer Science &amp; Engineering • Currently 5th Semester</text>

    <!-- Status bar -->
    <rect x="24" y="126" width="362" height="3" rx="1.5" fill="#1a1a26"/>
    <rect x="24" y="126" height="3" rx="1.5" fill="url(#gold)" opacity=".75">
      <animate attributeName="width" from="0" to="362" dur="2.5s" fill="freeze"/>
    </rect>
    <circle cx="380" cy="127.5" r="3" fill="#4ADE80" class="pulse" filter="url(#glow)"/>
  </g>

  <!-- ========== CARD 2: Production Apps (Top-Right) ========== -->
  <g transform="translate(450,18)">
    <rect width="410" height="140" class="cardBg" fill="#0a0a14" stroke="#059669" stroke-width=".8" stroke-opacity=".3"/>
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#greenG)" opacity=".6"/>
    <circle cx="16" cy="16" r="3" fill="#4ADE80" opacity=".3"/>
    <circle cx="394" cy="16" r="3" fill="#4ADE80" opacity=".3"/>

    <text x="24" y="34" class="label">PRODUCTION SYSTEMS</text>

    <text x="24" y="80" class="bigVal" font-size="38">5+</text>
    <text x="82" y="80" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" font-weight="700" fill="#4ADE80" filter="url(#glow)">SHIPPED &amp; DEPLOYED</text>

    <text x="24" y="100" class="desc">Enterprise ERP, Real-Time Collaboration, SaaS Platforms</text>
    <text x="24" y="116" class="subDesc">Next.js • React • PostgreSQL • Prisma ORM • WebSockets • Flask</text>

    <rect x="24" y="126" width="362" height="3" rx="1.5" fill="#1a1a26"/>
    <rect x="24" y="126" height="3" rx="1.5" fill="url(#greenG)" opacity=".75">
      <animate attributeName="width" from="0" to="300" dur="2.5s" fill="freeze"/>
    </rect>
    <circle cx="318" cy="127.5" r="3" fill="#4ADE80" class="pulse" filter="url(#glow)"/>
  </g>

  <!-- ========== CARD 3: Competition Record (Bottom-Left) ========== -->
  <g transform="translate(20,176)">
    <rect width="410" height="140" class="cardBg" fill="#0a0a14" stroke="#D4AF37" stroke-width=".8" stroke-opacity=".3"/>
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#gold)" opacity=".6"/>
    <circle cx="16" cy="16" r="3" fill="#FFDF73" opacity=".3"/>
    <circle cx="394" cy="16" r="3" fill="#FFDF73" opacity=".3"/>

    <text x="24" y="34" class="label">COMPETITION VICTORIES</text>

    <text x="24" y="78" class="bigVal" font-size="36">1ST PRIZE</text>
    <text x="218" y="78" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" fill="#FFDF73">× 2 Wins</text>

    <text x="24" y="98" class="desc">🥇 MERI-CET Project Competition — COACT (Software)</text>
    <text x="24" y="114" class="desc">🏆 Best Student Innovator — Startup Carnival Haryana 2026</text>

    <rect x="24" y="126" width="362" height="3" rx="1.5" fill="#1a1a26"/>
    <rect x="24" y="126" height="3" rx="1.5" fill="url(#gold)" opacity=".75">
      <animate attributeName="width" from="0" to="340" dur="2.5s" fill="freeze"/>
    </rect>
    <circle cx="358" cy="127.5" r="3" fill="#FFDF73" class="pulse" filter="url(#glow)"/>
  </g>

  <!-- ========== CARD 4: Core Architecture (Bottom-Right) ========== -->
  <g transform="translate(450,176)">
    <rect width="410" height="140" class="cardBg" fill="#0a0a14" stroke="#0891B2" stroke-width=".8" stroke-opacity=".3"/>
    <rect x="1" y="1" width="408" height="3" rx="2" fill="url(#cyanG)" opacity=".6"/>
    <circle cx="16" cy="16" r="3" fill="#22D3EE" opacity=".3"/>
    <circle cx="394" cy="16" r="3" fill="#22D3EE" opacity=".3"/>

    <text x="24" y="34" class="label">CORE ARCHITECTURE STACK</text>

    <text x="24" y="70" class="bigVal" font-size="28">FULL STACK</text>
    <text x="210" y="70" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#22D3EE">ARCHITECT</text>

    <!-- Tech badge row 1 -->
    <g transform="translate(24,82)">
      <rect width="58" height="20" rx="4" fill="#121220" stroke="#D4AF37" stroke-width=".6" stroke-opacity=".4"/>
      <text x="29" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#FFDF73" font-weight="700">Next.js</text>

      <rect x="66" width="50" height="20" rx="4" fill="#121220" stroke="#D4AF37" stroke-width=".6" stroke-opacity=".4"/>
      <text x="91" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#FFDF73" font-weight="700">React</text>

      <rect x="124" width="78" height="20" rx="4" fill="#121220" stroke="#D4AF37" stroke-width=".6" stroke-opacity=".4"/>
      <text x="163" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#FFDF73" font-weight="700">TypeScript</text>

      <rect x="210" width="80" height="20" rx="4" fill="#121220" stroke="#059669" stroke-width=".6" stroke-opacity=".4"/>
      <text x="250" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#4ADE80" font-weight="700">PostgreSQL</text>

      <rect x="298" width="56" height="20" rx="4" fill="#121220" stroke="#059669" stroke-width=".6" stroke-opacity=".4"/>
      <text x="326" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#4ADE80" font-weight="700">Prisma</text>
    </g>
    <!-- Tech badge row 2 -->
    <g transform="translate(24,108)">
      <rect width="86" height="20" rx="4" fill="#121220" stroke="#0891B2" stroke-width=".6" stroke-opacity=".4"/>
      <text x="43" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#22D3EE" font-weight="700">WebSockets</text>

      <rect x="94" width="48" height="20" rx="4" fill="#121220" stroke="#0891B2" stroke-width=".6" stroke-opacity=".4"/>
      <text x="118" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#22D3EE" font-weight="700">Flask</text>

      <rect x="150" width="56" height="20" rx="4" fill="#121220" stroke="#6D28D9" stroke-width=".6" stroke-opacity=".4"/>
      <text x="178" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#A78BFA" font-weight="700">Python</text>

      <rect x="214" width="40" height="20" rx="4" fill="#121220" stroke="#6D28D9" stroke-width=".6" stroke-opacity=".4"/>
      <text x="234" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#A78BFA" font-weight="700">C++</text>

      <rect x="262" width="46" height="20" rx="4" fill="#121220" stroke="#6D28D9" stroke-width=".6" stroke-opacity=".4"/>
      <text x="285" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#A78BFA" font-weight="700">SQL</text>
    </g>
  </g>
</svg>

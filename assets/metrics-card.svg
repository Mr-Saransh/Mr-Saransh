<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>

    <linearGradient id="metricGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <filter id="glowMetric" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1: Academic Standing Rank 1st Sem II & IV -->
  <g transform="translate(10, 10)">
    <rect width="232" height="140" rx="12" fill="url(#cardGrad)" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="30" r="14" fill="#181822" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">⭐</text>
    <text x="52" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D4AF37">ACADEMICS</text>
    <text x="20" y="72" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="url(#metricGold)">Rank 1st Topper</text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Sem II &amp; Sem IV (Ongoing 5th)</text>
    <text x="20" y="116" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E5E7EB">MERI CET • MDU University</text>
  </g>

  <!-- Panel 2: Featured Full Stack Projects -->
  <g transform="translate(258, 10)">
    <rect width="232" height="140" rx="12" fill="url(#cardGrad)" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="30" r="14" fill="#181822" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🚀</text>
    <text x="52" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D4AF37">PORTFOLIO</text>
    <text x="20" y="72" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="url(#metricGold)">5+ Scaled Apps</text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">ERP, Real-time &amp; AI Tools</text>
    <text x="20" y="116" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E5E7EB">Apni Estate, ACTIFY, COACT</text>
  </g>

  <!-- Panel 3: Awards & Recognition -->
  <g transform="translate(506, 10)">
    <rect width="232" height="140" rx="12" fill="url(#cardGrad)" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="30" r="14" fill="#181822" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🏆</text>
    <text x="52" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D4AF37">RECOGNITION</text>
    <text x="20" y="72" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="url(#metricGold)">1st Prize &amp; Innovator</text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">MERI-CET &amp; Startup Carnival</text>
    <text x="20" y="116" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E5E7EB">State &amp; University Wins</text>
  </g>

  <!-- Panel 4: Architecture Core -->
  <g transform="translate(754, 10)">
    <rect width="236" height="140" rx="12" fill="url(#cardGrad)" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="30" r="14" fill="#181822" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">⚡</text>
    <text x="52" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D4AF37">STACK CORE</text>
    <text x="20" y="72" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="url(#metricGold)">Full Stack Next.js</text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">React • PostgreSQL • Prisma</text>
    <text x="20" y="116" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E5E7EB">WebSockets &amp; Python APIs</text>
  </g>
</svg>
